<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15100b" />
    <meta name="description" content="Ejercicios faciales para una mandíbula definida, mejor respiración y postura craneofacial óptima." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FACEO" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <title>FACEO</title>
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:radial-gradient(120% 90% at 50% 40%,#2a2118 0%,#15100b 70%);transition:opacity .5s ease;}
      #splash.hide{opacity:0;pointer-events:none;}
      #splash .mark{font-family:'Fraunces',Georgia,serif;font-size:88px;font-weight:600;color:#c9a96e;line-height:1;
        animation:splashBreathe 2.4s ease-in-out infinite;letter-spacing:-.02em;}
      #splash .word{font-family:'Fraunces',Georgia,serif;font-size:15px;letter-spacing:.42em;color:#8a7a5e;text-transform:uppercase;padding-left:.42em;}
      @keyframes splashBreathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.06);opacity:1}}
    </style>
  </head>
  <body>
    <div id="splash"><div class="mark">F</div><div class="word">Faceo</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
