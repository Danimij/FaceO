<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Entrena la cadena miofascial completa: mandíbula, rostro, postura y respiración. De los pies a la cara." />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FACEO" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <title>FACEO — Rostro y cadena miofascial</title>
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:radial-gradient(120% 90% at 50% 40%,#2a2118 0%,#15100b 70%);transition:opacity .5s ease;}
      #splash.hide{opacity:0;pointer-events:none;}
      #splash .mark{font-family:'Fraunces',Georgia,serif;font-size:88px;font-weight:600;color:#c9a96e;line-height:1;
        animation:splashBreathe 2.4s ease-in-out infinite;letter-spacing:-.02em;}
      #splash .word{font-family:'Fraunces',Georgia,serif;font-size:15px;letter-spacing:.42em;color:#8a7a5e;text-transform:uppercase;padding-left:.42em;}
      @keyframes splashBreathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.06);opacity:1}}
    </style>
  <meta property="og:title" content="FACEO — Rostro y cadena miofascial">
<meta property="og:description" content="Cara, mandíbula y postura desde la cadena miofascial completa. Gratis, sin humo.">
<meta property="og:image" content="https://faceo-saludreal.netlify.app/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
</head>
  <body>
    <div id="splash"><div class="mark">F</div><div class="word">Faceo</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <!-- INSTALL BANNER (autocontenido) -->
<style>
#instbn{position:fixed;left:12px;right:12px;bottom:12px;z-index:9998;background:#16211f;color:#eef6f4;border:1px solid #2a3a37;border-radius:16px;padding:14px 16px;display:none;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:-apple-system,'Inter',sans-serif;max-width:460px;margin:0 auto}
#instbn .ib-ic{font-size:26px;flex-shrink:0}
#instbn .ib-tx{flex:1;font-size:13px;line-height:1.45}
#instbn .ib-tx b{color:#fff}
#instbn .ib-go{flex-shrink:0;background:#2ee6c8;color:#062018;border:none;border-radius:11px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
#instbn .ib-x{flex-shrink:0;background:none;border:none;color:#8fa39e;font-size:20px;cursor:pointer;line-height:1;padding:2px 6px}
</style>
<div id="instbn"><span class="ib-ic">📲</span><span class="ib-tx" id="ib-tx"></span><button class="ib-go" id="ib-go" style="display:none">Instalar</button><button class="ib-x" onclick="document.getElementById('instbn').style.display='none';try{localStorage.setItem('inst-dismiss','1')}catch(e){}">×</button></div>
<script>(function(){
  try{ if(localStorage.getItem('inst-dismiss')==='1')return; }catch(e){}
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  if(standalone)return; // ya instalada
  var isIOS=/iP(hone|ad|od)/.test(navigator.userAgent);
  var bn=document.getElementById('instbn'),tx=document.getElementById('ib-tx'),go=document.getElementById('ib-go');
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;tx.innerHTML='<b>Instala la app</b> en tu móvil — funciona sin conexión.';go.style.display='';bn.style.display='flex';});
  go.addEventListener('click',function(){if(deferred){deferred.prompt();deferred=null;bn.style.display='none';}});
  if(isIOS){ tx.innerHTML='<b>Añádela a tu inicio:</b> pulsa el botón Compartir (cuadrado con flecha ↑) abajo, y luego "Añadir a pantalla de inicio".'; setTimeout(function(){bn.style.display='flex';},1800); }
})();</script>

</body>
</html>
