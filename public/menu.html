<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú del día — Dani</title>
<meta name="theme-color" content="#0a0f0e">
<link rel="manifest" href="habito-manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0a0f0e;--card:#121a18;--card2:#18211f;--br:#243330;--tx:#eef6f4;--tx2:#8fa39e;--ac:#2ee6c8;--ac2:#ff6a1f;--sun:#f2b34d}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--tx);font-family:'Inter',-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:36px 20px 60px}
  .serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.02em}
  .top{text-align:center;margin-bottom:20px}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx2);font-weight:600;margin-bottom:8px}
  h1{font-family:'Fraunces',serif;font-size:26px;font-weight:600}
  .streak{display:flex;gap:12px;margin:18px 0}
  .st{flex:1;background:var(--card);border:1px solid var(--br);border-radius:16px;padding:13px;text-align:center}
  .st .num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;line-height:1;color:var(--ac)}
  .st .num.warm{color:var(--ac2)}
  .st .lbl{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
  .win{background:rgba(242,179,77,.08);border:1px solid rgba(242,179,77,.3);border-radius:14px;padding:12px 15px;margin-bottom:16px;font-size:12.5px;color:#e7d8bd;line-height:1.5}
  .win b{color:var(--sun)}
  .meal{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:16px 17px;margin-bottom:11px}
  .meal .mt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
  .meal .mn{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);font-weight:700}
  .meal .mh{font-size:11px;color:var(--tx2)}
  .meal p{font-size:14px;color:var(--tx);line-height:1.5}
  .meal.special{border-color:rgba(255,106,31,.45);background:linear-gradient(135deg,rgba(255,106,31,.1),var(--card))}
  .meal.special .mn{color:var(--ac2)}
  .h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);font-weight:600;margin:22px 0 12px}
  .item{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;background:var(--card);border:1px solid var(--br);border-radius:14px;margin-bottom:9px;cursor:pointer;transition:border-color .2s}
  .item.on{border-color:var(--ac)}
  .item .ck{width:24px;height:24px;border-radius:8px;border:1.7px solid var(--br);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#062018;margin-top:1px}
  .item.on .ck{background:var(--ac);border-color:var(--ac)}
  .item .tt{flex:1}
  .item .tt .n{font-size:14px;font-weight:600}
  .item.on .tt .n{color:var(--tx2);text-decoration:line-through}
  .item .tt .d{font-size:11.5px;color:var(--tx2);margin-top:1px}
  .done-msg{text-align:center;background:linear-gradient(135deg,rgba(46,230,200,.14),#121a18);border:1px solid rgba(46,230,200,.4);border-radius:16px;padding:16px;margin-top:8px}
  .done-msg .fire{font-size:32px;margin-bottom:4px}
  .done-msg .m{font-family:'Fraunces',serif;font-size:17px;font-weight:600}
  .note{font-size:11.5px;color:var(--tx2);line-height:1.5;margin-top:16px;background:var(--card2);border:1px solid var(--br);border-radius:14px;padding:13px 15px}
  .note b{color:var(--tx)}
  .foot{text-align:center;color:#5a6b67;font-size:11.5px;margin-top:26px;line-height:1.7}
  .reset{background:none;border:none;color:#5a6b67;font-size:11.5px;text-decoration:underline;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="kicker">Menú · comer en horas de sol</div>
    <h1 class="serif" id="dayName">Hoy</h1>
  </div>

  <div class="streak">
    <div class="st"><div class="num warm" id="streak">0</div><div class="lbl">Racha 🔥</div></div>
    <div class="st"><div class="num" id="pct">0%</div><div class="lbl">Hoy</div></div>
  </div>

  <div class="win">☀️ <b>Ventana:</b> rompe el ayuno ~13-14 h (Comida 1, la grande) · Comida 2 ~18-19 h, con luz. Ayuno nocturno ~16 h. Proteína en las dos.</div>

  <div id="meals"></div>

  <div class="h">Hábitos de hoy</div>
  <div id="items"></div>

  <div id="doneMsg"></div>

  <div class="note" id="socialNote"></div>

  <div class="foot">
    Comidas sociales sin culpa: paella y pizza también son vida.<br>
    <button class="reset" onclick="resetToday()">Desmarcar hoy</button>
  </div>
</div>

<script>
var DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
// index 0=Domingo ... 6=Sábado
var MENU={
  1:{c1:'3-4 huevos + boniato asado + espinacas en AOVE + aguacate + plátano', c2:'Salmón al horno + calabacín y zanahoria asados + nueces'},
  2:{c1:'Ternera o pollo a la plancha + arroz cocido y enfriado + brócoli + AOVE', c2:'Tortilla de 3 huevos + crema de calabaza + medio aguacate'},
  3:{c1:'Pescado azul (sardinas/caballa) + patata cocida + pimientos asados + AOVE', c2:'Pollo + verduras salteadas + arándanos'},
  4:{c1:'3-4 huevos + boniato + champiñones + espinacas + AOVE', c2:'Merluza + puré de patata y zanahoria + nueces'},
  5:{c1:'Carne magra o pollo + verduras + AOVE (más proteína, menos carbo: la pizza trae el carbo)', c2:'🍕 PIZZA de la pizzería del pueblo — tu comida social. Disfrútala. Agua, no refresco.', special:2},
  6:{c1:'🥘 PAELLA en familia — arroz + proteína (marisco/pollo/conejo) + verdura. Ración generosa de proteína, sin repetir arroz.', c2:'Huevos revueltos + verdura cocinada + nueces', special:1},
  0:{c1:'Pescado azul + boniato + verduras asadas + AOVE (o la paella si os toca domingo)', c2:'Reset ligero: caldo de verduras + 2 huevos + aguacate'}
};
var HABITS=[
  {id:'prot', n:'Proteína en las dos comidas', d:'~70 g por comida. Tu prioridad nº1.'},
  {id:'ventana', n:'Comí en mi ventana de sol', d:'Ayuno matutino respetado, última comida con luz.'},
  {id:'hidro', n:'Hidratación (+ sales si diarrea)', d:'Agua durante el día; en el ayuno también.'},
  {id:'cena', n:'Cena pronto y ligera', d:'2-3 h antes de dormir.'},
  {id:'andar', n:'Andar 10 min tras comer', d:'Mueve el intestino y la glucosa.'}
];
var SOCIAL={
  5:'🍕 <b>Hoy es viernes de pizza.</b> Sin culpa: una pizza a la semana no descarrila nada. Cénala un poco antes si puedes, y el resto de la semana lo sostiene. Bonus: el gluten viene bien hasta la prueba de celiaquía.',
  6:'🥘 <b>Hoy toca paella.</b> Es comida real: arroz + proteína + verdura. Sírvete bien de la parte de proteína y no te pases repitiendo arroz. A disfrutar en familia.'
};

function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function load(){try{return JSON.parse(localStorage.getItem('menu-tracker'))||{};}catch(e){return{};}}
function save(s){localStorage.setItem('menu-tracker',JSON.stringify(s));}

function toggleItem(id){var s=load();var k=today();s[k]=s[k]||{};s[k][id]=!s[k][id];save(s);render();}
function resetToday(){var s=load();delete s[today()];save(s);render();}
function streakCount(s){
  var cnt=0; var d=new Date(); d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  for(var i=0;i<60;i++){
    var key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    var day=s[key]||{}; var all=HABITS.every(function(h){return day[h.id];});
    if(all)cnt++; else { if(i>0) break; }
    if(!all && i>0) break;
    d.setDate(d.getDate()-1);
  }
  return cnt;
}

function render(){
  var s=load(); var k=today(); var day=s[k]||{};
  var dow=new Date().getDay();
  document.getElementById('dayName').textContent=DAYS[dow];
  var m=MENU[dow];
  document.getElementById('meals').innerHTML=
    '<div class="meal'+(m.special===1?' special':'')+'"><div class="mt"><span class="mn">Comida 1</span><span class="mh">≈ 13-14 h · la grande</span></div><p>'+m.c1+'</p></div>'+
    '<div class="meal'+(m.special===2?' special':'')+'"><div class="mt"><span class="mn">Comida 2</span><span class="mh">≈ 18-19 h · ligera</span></div><p>'+m.c2+'</p></div>';

  var done=HABITS.filter(function(h){return day[h.id];}).length;
  document.getElementById('pct').textContent=Math.round(done/HABITS.length*100)+'%';
  document.getElementById('streak').textContent=streakCount(s);

  document.getElementById('items').innerHTML=HABITS.map(function(h){
    var on=!!day[h.id];
    return '<div class="item'+(on?' on':'')+'" onclick="toggleItem(\''+h.id+'\')"><div class="ck">'+(on?'✓':'')+'</div>'+
      '<div class="tt"><div class="n">'+h.n+'</div><div class="d">'+h.d+'</div></div></div>';
  }).join('');

  var dm=document.getElementById('doneMsg');
  dm.innerHTML = done===HABITS.length
    ? '<div class="done-msg"><div class="fire">🔥</div><div class="m">Día redondo</div><div style="font-size:12.5px;color:var(--tx2);margin-top:4px">Racha de '+streakCount(s)+'. Mañana, otra.</div></div>'
    : '';

  var sn=document.getElementById('socialNote');
  if(SOCIAL[dow]){ sn.style.display=''; sn.innerHTML=SOCIAL[dow]; }
  else { sn.style.display=''; sn.innerHTML='<b>Recuerda:</b> proteína alta, comida real, y andar tras comer. El 90% del resultado está aquí, no en los suplementos.'; }
}
render();
</script>
</body>
</html>
